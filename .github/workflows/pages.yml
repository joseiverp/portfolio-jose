name: Publicar portfolio en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v7
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Preparar el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v5

